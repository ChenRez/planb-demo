<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>PlanB - התראות</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/global.css" />

    <link rel="stylesheet" href="css/notificationsStyle.css" />
    <link rel="stylesheet" href="css/navBar.css" />
    <link rel="stylesheet" href="css/appHeader.css" />
      <link rel="stylesheet" href="css/responsive.css" />
</head>
  <body>
    <div class="mobile-container">
      <div class="back-btn" onclick="window.location.href='home.html'">
        <span class="material-symbols-rounded">arrow_forward</span>
      </div>

      <div class="scroll-content">
        <h1 class="main-title">התראות</h1>

        <div class="notif-list">
        </div>
      </div>

      <div id="rateModal" class="modal-backdrop">
        <div class="modal-card">
          <button class="close-modal" onclick="closeRateModal()">
            &times;
          </button>

          <div class="user-avatar-large"></div>
          <h3 class="rate-title">דניאל כהן</h3>
          <p class="rate-sub">מכירת כרטיסים לקולדפליי</p>

          <div class="rating-questions">
            <div class="q-item">
              <span class="q-label"
                >האם העסקה הייתה אמינה והכרטיס עבד כמצופה?</span
              >
              <div class="q-stars" id="stars-reliability">
                <i class="fas fa-star active"></i
                ><i class="fas fa-star active"></i
                ><i class="fas fa-star active"></i
                ><i class="fas fa-star active"></i
                ><i class="fas fa-star active"></i>
              </div>
            </div>

            <div class="q-item">
              <div
                style="
                  display: flex;
                  justify-content: space-between;
                  align-items: flex-start;
                "
              >
                <span class="q-label" style="width: 70%"
                  >עד כמה המוכר היה זמין ותקשורתי?</span
                >
                <span class="na-link" onclick="toggleNA(this)">לא דיברנו</span>
              </div>
              <div class="q-stars" id="stars-communication">
                <i class="fas fa-star active"></i
                ><i class="fas fa-star active"></i
                ><i class="fas fa-star active"></i
                ><i class="fas fa-star active"></i
                ><i class="fas fa-star active"></i>
              </div>
            </div>

            <div class="q-item">
              <span class="q-label">עד כמה המחיר היה הוגן לדעתך?</span>
              <div class="q-stars" id="stars-price">
                <i class="fas fa-star active"></i
                ><i class="fas fa-star active"></i
                ><i class="fas fa-star active"></i
                ><i class="fas fa-star active"></i><i class="fas fa-star"></i>
              </div>
            </div>
          </div>

          <textarea
            style="
              width: 100%;
              border: 1px solid #eee;
              border-radius: 12px;
              padding: 10px;
              font-family: inherit;
              margin-bottom: 15px;
              resize: none;
              font-size: 13px;
            "
            rows="2"
            placeholder="רוצה להוסיף משהו? (אופציונלי)"
          ></textarea>

          <button class="btn-submit-rate" onclick="submitRating()">
            שלח דירוג
          </button>
        </div>
      </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/services/apiService.js"></script>
    <script src="js/components/toast.js"></script>
    <script src="js/services/notificationService.js"></script>
    <script src="js/pages/notificationsPage.js"></script>
    <script src="js/components/navBar.js"></script>
    <script src="js/components/appHeader.js"></script>
  </body>
</html>
