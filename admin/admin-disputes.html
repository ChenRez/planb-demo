<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlanB - ניהול מחלוקות</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      /* --- משתנים בסיסיים (זהה לשאר המערכת) --- */
      :root {
        --brand-gradient: linear-gradient(
          to right,
          #ed5f65 0%,
          #c53e5c 70%,
          #b34467 100%
        );
        --primary-solid: #ff4757;
        --accent-yellow: #ffd166;
        --bg-app: #f7f7f9;
        --bg-surface: #ffffff;
        --text-main: #2d3436;
        --text-sub: #909090;
        --radius-l: 40px;
        --shadow-card: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Open Sans", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        background-color: #e0e0e0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        direction: rtl;
      }

      .mobile-container {
        width: 100%;
        max-width: 448px;
        height: 100vh;
        max-height: 896px;
        background-color: var(--bg-app);
        border-radius: var(--radius-l);
        overflow: hidden;
        position: relative;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
      }

      /* Header */
      .header {
        padding: 20px 20px 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--bg-surface);
        position: sticky;
        top: 0;
        z-index: 20;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      }
      .header-title {
        font-size: 18px;
        font-weight: 800;
        color: var(--text-main);
      }
      .icon-btn {
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 0;
        color: var(--text-main);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        transition: 0.2s;
      }
      .icon-btn:hover { background-color: #f0f2f5; }
      .icon-btn i { font-size: 20px; }

      .scroll-content {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        padding-bottom: 40px;
      }
      .scroll-content::-webkit-scrollbar { display: none; }

      /* Tabs */
      .admin-tabs-wrapper {
        display: flex;
        background: #e0e0e0;
        padding: 4px;
        border-radius: 14px;
        margin-bottom: 18px;
      }
      .admin-tab {
        flex: 1;
        text-align: center;
        padding: 8px 0;
        font-size: 13px;
        font-weight: 700;
        color: var(--text-sub);
        cursor: pointer;
        border-radius: 10px;
        transition: 0.2s;
        background: transparent;
        border: none;
      }
      .admin-tab.active {
        background: white;
        color: var(--text-main);
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }

      /* Dispute list */
      .admin-dispute-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* Dispute card (same shadow/border pattern as admin-ticket-card) */
      .admin-dispute-card {
        background: var(--bg-surface);
        border-radius: 18px;
        padding: 16px;
        box-shadow: var(--shadow-card);
        border: 1px solid transparent;
        cursor: pointer;
        display: block;
        transition: 0.2s;
        text-decoration: none;
      }
      .admin-dispute-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        border-color: rgba(197, 62, 92, 0.15);
      }

      /* Card header: name + date */
      .admin-ticket-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 6px;
      }
      .admin-user-name {
        font-size: 15px;
        font-weight: 800;
        color: var(--text-main);
      }
      .admin-time {
        font-size: 11px;
        color: #b2bec3;
        font-weight: 600;
      }

      /* Tags row */
      .admin-ticket-tags {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .admin-tag {
        font-size: 10px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 6px;
      }
      .type-not-valid      { background: #ffebee; color: #c62828; }
      .type-not-transferred{ background: #fff3e0; color: #e65100; }
      .type-payment-issue  { background: #e8f5e9; color: #2e7d32; }
      .type-other          { background: #f5f5f5; color: #616161; }
      .status-open         { background: #fff9c4; color: #f57f17; }
      .status-inreview     { background: #e3f2fd; color: #1565c0; }
      .status-resolved     { background: #e8f5e9; color: #2e7d32; }
      .status-closed       { background: #f5f5f5; color: #616161; }

      /* Description snippet */
      .admin-ticket-snippet {
        font-size: 13px;
        color: var(--text-sub);
        line-height: 1.4;
        margin-bottom: 10px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* Card footer */
      .admin-ticket-meta {
        border-top: 1px solid #f0f0f0;
        padding-top: 8px;
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #999;
        font-weight: 600;
      }

      /* Empty state */
      .empty-state {
        text-align: center;
        padding: 50px 20px;
        color: var(--text-sub);
      }
      .empty-state i {
        font-size: 40px;
        margin-bottom: 12px;
        display: block;
        opacity: 0.3;
      }
    </style>
      <link rel="stylesheet" href="../css/responsive.css" />
</head>

  <body>
    <div class="mobile-container">
      <header class="header">
        <button
          class="icon-btn"
          onclick="window.location.href = 'admin-dashboard.html'"
        >
          <i class="fas fa-arrow-right"></i>
        </button>
        <div class="header-title">ניהול מחלוקות</div>
        <div style="width: 40px"></div>
      </header>

      <main class="scroll-content">
        <div class="admin-tabs-wrapper">
          <button class="admin-tab active" data-status="Open"     onclick="switchDisputeTab(this)">פתוח</button>
          <button class="admin-tab"        data-status="InReview" onclick="switchDisputeTab(this)">בטיפול</button>
          <button class="admin-tab"        data-status="Resolved" onclick="switchDisputeTab(this)">נפתר</button>
        </div>

        <div class="admin-dispute-list" id="disputeList">
          <!-- Populated by adminDisputesPage.js -->
        </div>
      </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/services/apiService.js"></script>
    <script src="js/disputeService.js"></script>
    <script src="js/adminDisputesPage.js"></script>
  </body>
</html>
