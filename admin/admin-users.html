<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlanB - ניהול משתמשים</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      /* --- 1. משתנים ומחלקות בסיס (זהה לשאר האפליקציה) --- */
      :root {
        --brand-gradient: linear-gradient(
          to right,
          #ed5f65 0%,
          #c53e5c 70%,
          #b34467 100%
        );
        --primary-solid: #ff4757;
        --accent-yellow: #ffd166;
        --bg-app: #f7f7f9;
        --bg-surface: #ffffff;
        --text-main: #2d3436;
        --text-sub: #909090;
        --radius-l: 40px;
        --radius-m: 24px;
        --shadow-card: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Open Sans", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        background-color: #e0e0e0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        direction: rtl;
      }

      .mobile-container {
        width: 100%;
        max-width: 448px;
        height: 100vh;
        max-height: 896px;
        background-color: var(--bg-app);
        border-radius: var(--radius-l);
        overflow: hidden;
        position: relative;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
      }

      /* Header עיצוב בסיסי */
      .header {
        padding: 20px 20px 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--bg-surface);
        position: sticky;
        top: 0;
        z-index: 20;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      }

      .header-title {
        font-size: 18px;
        font-weight: 800;
        color: var(--text-main);
      }

      .icon-btn {
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 0;
        color: var(--text-main);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        transition: 0.2s;
      }
      .icon-btn:hover {
        background-color: #f0f2f5;
      }
      .icon-btn i {
        font-size: 20px;
      }

      .scroll-content {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
      }
      .scroll-content::-webkit-scrollbar {
        display: none;
      }

      /* --- 2. CSS ייחודי למסך ניהול משתמשים (admin- prefix) --- */

      /* אזור חיפוש */
      .admin-search-wrapper {
        margin-bottom: 20px;
        position: relative;
      }
      .admin-search-input {
        width: 100%;
        padding: 14px 45px 14px 16px;
        border-radius: 18px;
        background-color: #ffffff;
        border: 1px solid #e0e0e0;
        font-size: 14px;
        color: var(--text-main);
        outline: none;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
      }
      .admin-search-input:focus {
        border-color: var(--primary-solid);
      }
      .admin-search-icon {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #b2bec3;
      }

      /* צ'יפים / פילטרים */
      .admin-filters-row {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        overflow-x: auto;
        padding-bottom: 5px; /* מקום לגלריה אם צריך */
      }
      .admin-filters-row::-webkit-scrollbar {
        display: none;
      }

      .admin-chip {
        white-space: nowrap;
        padding: 8px 16px;
        background: #ffffff;
        border: 1px solid #e0e0e0;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-sub);
        cursor: pointer;
        transition: 0.2s;
      }
      .admin-chip.active {
        background: var(--brand-gradient);
        color: white;
        border-color: transparent;
        box-shadow: 0 4px 10px rgba(197, 62, 92, 0.3);
      }

      /* רשימת משתמשים */
      .admin-users-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .admin-user-card {
        background: var(--bg-surface);
        padding: 15px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        gap: 15px;
        box-shadow: var(--shadow-card);
        text-decoration: none; /* כי זה לינק */
        transition: 0.2s;
        border: 1px solid transparent;
      }
      .admin-user-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      }

      /* תמונת פרופיל */
      .admin-avatar {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        object-fit: cover;
        background-color: #eee;
        border: 2px solid #fff;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      /* פרטי טקסט */
      .admin-user-info {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .admin-user-name {
        font-size: 15px;
        font-weight: 700;
        color: var(--text-main);
      }
      .admin-user-meta {
        font-size: 12px;
        color: var(--text-sub);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .admin-star-icon {
        color: var(--accent-yellow);
        font-size: 12px;
      }

      /* תגיות סטטוס */
      .admin-status-badge {
        font-size: 11px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 12px;
        display: inline-block;
      }
      .status-active {
        background-color: #d1fae5;
        color: #065f46;
      }
      .status-flagged {
        background-color: #fff3cd;
        color: #856404;
      }
      .status-blocked {
        background-color: #fee2e2;
        color: #991b1b;
      }

      .admin-chevron {
        color: #ccc;
        font-size: 14px;
        margin-right: 5px;
      }
    </style>
      <link rel="stylesheet" href="../css/responsive.css" />
</head>

  <body>
    <div class="mobile-container">
      <header class="header">
        <button
          class="icon-btn"
          onclick="window.location.href = 'admin-dashboard.html'"
        >
          <i class="fas fa-arrow-right"></i>
        </button>

        <div class="header-title">ניהול משתמשים</div>

        <div style="width: 40px"></div>
      </header>

      <main class="scroll-content">
        <div class="admin-search-wrapper">
          <i class="fas fa-search admin-search-icon"></i>
          <input
            type="text"
            class="admin-search-input"
            placeholder="חיפוש לפי שם / אימייל"
          />
        </div>

        <div class="admin-filters-row">
          <div class="admin-chip active">הכל</div>
          <div class="admin-chip">פעילים</div>
          <div class="admin-chip">חסומים</div>
          <div class="admin-chip">מסומנים</div>
        </div>

        <div class="admin-users-list">
          <p style="text-align:center;color:#999">טוען משתמשים...</p>
        </div>
      </main>
    </div>
      <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/services/apiService.js"></script>
    <script src="js/adminUsersPage.js"></script>
  </body>
</html>
